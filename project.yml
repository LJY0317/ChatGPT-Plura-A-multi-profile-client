name: "ChatGPT Plura — A multi-profile client"
options:
  bundleIdPrefix: io.github.LJY0317
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  iosMath:
    url: https://github.com/kostub/iosMath.git
    from: 2.5.0
targets:
  "ChatGPT Plura — A multi-profile client":
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: iosMath
    settings:
      base:
        PRODUCT_NAME: "Plura Mobile"
        PRODUCT_MODULE_NAME: ChatGPT_Plura___A_multi_profile_client
        PRODUCT_BUNDLE_IDENTIFIER: io.github.LJY0317.PluraMobile
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  ChatGPTPluraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: "ChatGPT Plura — A multi-profile client"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.LJY0317.PluraMobileUITests
        GENERATE_INFOPLIST_FILE: YES
  ChatGPTPluraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: "ChatGPT Plura — A multi-profile client"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.LJY0317.PluraMobileTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plura Mobile.app/Plura Mobile"
schemes:
  "ChatGPT Plura — A multi-profile client":
    build:
      targets:
        "ChatGPT Plura — A multi-profile client": all
        ChatGPTPluraTests: [test]
        ChatGPTPluraUITests: [test]
    test:
      targets:
        - ChatGPTPluraTests
        - ChatGPTPluraUITests
